name: Python checks

on:
  push:
  pull_request:

jobs:
  command-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run command-policy tests
        run: python -m unittest discover -s tests -v
      - name: Check controller syntax
        run: python -m py_compile controllers/tulpar_controller/tulpar_controller.py
