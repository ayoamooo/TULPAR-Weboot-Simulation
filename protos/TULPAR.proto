#VRML_SIM R2025a utf8

PROTO TULPAR [
  field SFVec3f    translation 0 0 0.055
  field SFRotation rotation    0 0 1 0
  field SFString   name        "TULPAR"
  field SFString   controller  "tulpar_controller"
]
{
Robot {
  translation IS translation
  rotation IS rotation
  name IS name
  controller IS controller
  supervisor TRUE
  children [
    # Low tracked base: target envelope approximately 0.35 m x 0.30 m.
    DEF BASE Shape {
      appearance PBRAppearance { baseColor 0.08 0.16 0.22 roughness 0.55 metalness 0.15 }
      geometry Box { size 0.36 0.30 0.10 }
    }
    # Belt runs sit above and below the exposed driven wheels so wheel rotation
    # remains visible from the room camera.
    Pose { translation 0 0.17 0.050 children [ Shape { appearance PBRAppearance { baseColor 0.035 0.045 0.055 roughness 0.92 } geometry Box { size 0.27 0.055 0.025 } } ] }
    Pose { translation 0 0.17 -0.050 children [ Shape { appearance PBRAppearance { baseColor 0.035 0.045 0.055 roughness 0.92 } geometry Box { size 0.27 0.055 0.025 } } ] }
    Pose { translation 0 -0.17 0.050 children [ Shape { appearance PBRAppearance { baseColor 0.035 0.045 0.055 roughness 0.92 } geometry Box { size 0.27 0.055 0.025 } } ] }
    Pose { translation 0 -0.17 -0.050 children [ Shape { appearance PBRAppearance { baseColor 0.035 0.045 0.055 roughness 0.92 } geometry Box { size 0.27 0.055 0.025 } } ] }
    # Track details are visual; four driven wheels provide the controlled drive path.
    Shape {
      appearance PBRAppearance { baseColor 0.63 0.72 0.78 roughness 0.48 metalness 0.12 }
      geometry Box { size 0.25 0.20 0.29 }
    }
    Pose {
      translation 0 0 0.25
      children [
        Shape {
          appearance PBRAppearance { baseColor 0.84 0.90 0.93 roughness 0.45 metalness 0.05 }
          geometry Box { size 0.23 0.18 0.20 }
        }
        # Smartphone frame and face panel.
        Pose {
          translation 0.121 0 0.035
          rotation 0 1 0 1.5708
          children [
            Shape {
              appearance PBRAppearance { baseColor 0.015 0.035 0.06 roughness 0.28 metalness 0.2 }
              geometry Box { size 0.18 0.13 0.012 }
            }
            Pose {
              translation 0 0 0.008
              children [
                Display {
                  name "face display"
                  width 256
                  height 320
                  children [
                    Shape {
                      appearance Appearance {
                        material Material { diffuseColor 0.06 0.42 0.56 emissiveColor 0.02 0.15 0.2 }
                        texture ImageTexture { url [ ] filtering 0 }
                      }
                      geometry Box { size 0.18 0.13 0.002 }
                    }
                  ]
                }
              ]
            }
          ]
        }
        # USB camera above the phone.
        Pose {
          translation 0.135 0 0.25
          rotation 0 1 0 1.5708
          children [
            Shape { appearance PBRAppearance { baseColor 0.10 0.12 0.14 roughness 0.45 } geometry Box { size 0.055 0.075 0.035 } }
            Pose { translation 0 0 0.021 children [ Shape { appearance PBRAppearance { baseColor 0.20 0.78 0.92 emissiveColor 0.03 0.18 0.22 } geometry Cylinder { radius 0.014 height 0.004 } } ] }
          ]
        }
      ]
    }
    # Two shoulder joints and fixed expressive claws.
    HingeJoint {
      jointParameters HingeJointParameters { axis 0 1 0 anchor 0 0.14 0.31 minStop -0.75 maxStop 0.75 }
      device [ RotationalMotor { name "left shoulder" maxTorque 2.5 maxVelocity 1.4 } PositionSensor { name "left shoulder sensor" } ]
      endPoint Solid {
        translation 0 0.14 0.31
        children [
          Pose { translation 0.04 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.56 0.68 0.75 roughness 0.52 metalness 0.08 } geometry Box { size 0.17 0.055 0.055 } } ] }
          # The claw is fixed: a small palm with two closed fingers, not a gripper.
          Pose { translation 0.145 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.15 0.22 0.28 roughness 0.62 } geometry Box { size 0.055 0.075 0.030 } } ] }
          Pose { translation 0.190 0.026 0 rotation 0 0 1 -0.45 children [ Shape { appearance PBRAppearance { baseColor 0.15 0.22 0.28 roughness 0.62 } geometry Box { size 0.075 0.018 0.025 } } ] }
          Pose { translation 0.190 -0.026 0 rotation 0 0 1 0.45 children [ Shape { appearance PBRAppearance { baseColor 0.15 0.22 0.28 roughness 0.62 } geometry Box { size 0.075 0.018 0.025 } } ] }
        ]
        boundingObject Group {
          children [ Pose { translation 0.07 0 0 children [ Box { size 0.32 0.11 0.07 } ] } ]
        }
        physics Physics { density -1 mass 0.16 }
      }
    }
    HingeJoint {
      jointParameters HingeJointParameters { axis 0 1 0 anchor 0 -0.14 0.31 minStop -0.75 maxStop 0.75 }
      device [ RotationalMotor { name "right shoulder" maxTorque 2.5 maxVelocity 1.4 } PositionSensor { name "right shoulder sensor" } ]
      endPoint Solid {
        translation 0 -0.14 0.31
        children [
          Pose { translation 0.04 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.56 0.68 0.75 roughness 0.52 metalness 0.08 } geometry Box { size 0.17 0.055 0.055 } } ] }
          # The claw is fixed: a small palm with two closed fingers, not a gripper.
          Pose { translation 0.145 0 0 children [ Shape { appearance PBRAppearance { baseColor 0.15 0.22 0.28 roughness 0.62 } geometry Box { size 0.055 0.075 0.030 } } ] }
          Pose { translation 0.190 0.026 0 rotation 0 0 1 -0.45 children [ Shape { appearance PBRAppearance { baseColor 0.15 0.22 0.28 roughness 0.62 } geometry Box { size 0.075 0.018 0.025 } } ] }
          Pose { translation 0.190 -0.026 0 rotation 0 0 1 0.45 children [ Shape { appearance PBRAppearance { baseColor 0.15 0.22 0.28 roughness 0.62 } geometry Box { size 0.075 0.018 0.025 } } ] }
        ]
        boundingObject Group {
          children [ Pose { translation 0.07 0 0 children [ Box { size 0.32 0.11 0.07 } ] } ]
        }
        physics Physics { density -1 mass 0.16 }
      }
    }
    # Four driven wheels sit inside the visual tracks. This keeps drive commands
    # coupled to Webots physics rather than translating the robot by script.
    HingeJoint {
      jointParameters HingeJointParameters { axis 0 1 0 anchor 0.13 0.17 0.0 }
      device [ RotationalMotor { name "left front track motor" maxVelocity 7 maxTorque 12 } PositionSensor { name "left front track sensor" } ]
      endPoint Solid {
        translation 0.13 0.17 0.0
        children [ Shape { appearance PBRAppearance { baseColor 0.04 0.05 0.06 roughness 0.9 } geometry Cylinder { radius 0.07 height 0.055 } } ]
        boundingObject Cylinder { radius 0.07 height 0.055 }
        physics Physics { density -1 mass 0.18 }
      }
    }
    HingeJoint {
      jointParameters HingeJointParameters { axis 0 1 0 anchor -0.13 0.17 0.0 }
      device [ RotationalMotor { name "left rear track motor" maxVelocity 7 maxTorque 12 } PositionSensor { name "left rear track sensor" } ]
      endPoint Solid {
        translation -0.13 0.17 0.0
        children [ Shape { appearance PBRAppearance { baseColor 0.04 0.05 0.06 roughness 0.9 } geometry Cylinder { radius 0.07 height 0.055 } } ]
        boundingObject Cylinder { radius 0.07 height 0.055 }
        physics Physics { density -1 mass 0.18 }
      }
    }
    HingeJoint {
      jointParameters HingeJointParameters { axis 0 1 0 anchor 0.13 -0.17 0.0 }
      device [ RotationalMotor { name "right front track motor" maxVelocity 7 maxTorque 12 } PositionSensor { name "right front track sensor" } ]
      endPoint Solid {
        translation 0.13 -0.17 0.0
        children [ Shape { appearance PBRAppearance { baseColor 0.04 0.05 0.06 roughness 0.9 } geometry Cylinder { radius 0.07 height 0.055 } } ]
        boundingObject Cylinder { radius 0.07 height 0.055 }
        physics Physics { density -1 mass 0.18 }
      }
    }
    HingeJoint {
      jointParameters HingeJointParameters { axis 0 1 0 anchor -0.13 -0.17 0.0 }
      device [ RotationalMotor { name "right rear track motor" maxVelocity 7 maxTorque 12 } PositionSensor { name "right rear track sensor" } ]
      endPoint Solid {
        translation -0.13 -0.17 0.0
        children [ Shape { appearance PBRAppearance { baseColor 0.04 0.05 0.06 roughness 0.9 } geometry Cylinder { radius 0.07 height 0.055 } } ]
        boundingObject Cylinder { radius 0.07 height 0.055 }
        physics Physics { density -1 mass 0.18 }
      }
    }
    Camera { translation 0.15 0 0.50 rotation 0 1 0 -1.5708 name "robot camera" width 640 height 480 fieldOfView 1.15 recognition Recognition { } }
    DistanceSensor { translation 0.205 0 0.22 rotation 0 1 0 -1.5708 name "front range sensor" type "sonar" lookupTable [ 0 0 0, 1.5 1.5 0 ] aperture 0.28 }
    Speaker { name "speaker" }
    GPS { name "gps" }
    InertialUnit { name "imu" }
  ]
  boundingObject Group {
    children [
      Box { size 0.39 0.42 0.12 }
      Pose { translation 0 0 0.25 children [ Box { size 0.25 0.20 0.29 } ] }
    ]
  }
  physics Physics { density -1 mass 8.5 }
}
}
